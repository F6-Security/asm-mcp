version: 2
updates:
  # Actions are pinned by commit SHA; Dependabot moves them deliberately, grouped.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Version updates are off: Dependabot edits pyproject.toml but cannot
  # regenerate requirements.lock. Security alerts keep working with a limit of 0.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
