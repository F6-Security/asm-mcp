name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A release whose tag does not match __version__ would upload nothing new to
  # PyPI (skip-existing) and leave the release pointing at the wrong code.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the release tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/asm_mcp/__init__.py)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # A job-level permissions block replaces the workflow-level one, so
      # checkout's contents: read has to be repeated here.
      contents: read
      # PyPI trusted publishing: no long-lived API token in repository secrets.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install build==1.3.0

      - run: python -m build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          # a version published by hand earlier must not fail the release
          skip-existing: true
